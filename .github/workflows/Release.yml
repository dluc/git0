name: Release (manual)

# Build, sign, notarize, and publish a signed DMG to a new GitHub Release.
# Triggered manually from the Actions tab. Builds for arm64 and x86_64,
# attaches both DMGs to one release.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0). Leave blank to auto-generate.'
        required: false
      prerelease:
        description: 'Mark release as pre-release'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            abi: arm64
          - os: macos-15-intel
            abi: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Read short version
        id: version
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Resources/Info.plist)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Prepare openssl (downgrade to openssl@3, then unlink)
        run: |
          brew uninstall --ignore-dependencies openssl 2>/dev/null || true
          rm -rf /usr/local/etc/openssl@3 /usr/local/etc/openssl@1.1 2>/dev/null || true
          brew install openssl@3
          brew unlink openssl@3

      - name: Bootstrap objective-git and build libgit2
        run: |
          cd External/objective-git
          ./script/bootstrap
          ./script/update_libgit2

      - name: Import code signing certificate
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          rm -f $RUNNER_TEMP/certificate.p12

          # Extract the Developer ID identity for codesign --sign
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
          if [ -z "$IDENTITY" ]; then
            IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | head -1 | sed -E 's/^.*\) (.*)$/\1/')
          fi
          echo "CODE_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "Using identity: $IDENTITY"

      - name: Build app
        run: |
          xcodebuild \
            -workspace GitX.xcworkspace \
            -scheme GitX \
            -configuration Release \
            -derivedDataPath build \
            -destination "platform=macOS,arch=${{ matrix.abi }}" \
            ARCHS="${{ matrix.abi }}" \
            ONLY_ACTIVE_ARCH=YES \
            build

          BUILT_APP="build/Build/Products/Release/git0.app"
          if [ ! -d "$BUILT_APP" ]; then
            echo "git0.app not found"; find build/Build/Products -maxdepth 3 -name '*.app'; exit 1
          fi
          mkdir -p out && cp -R "$BUILT_APP" out/

      - name: Sign app with Developer ID
        run: |
          set -euo pipefail
          APP_PATH="out/git0.app"

          # An empty entitlements file. Resigning with this strips the
          # com.apple.security.get-task-allow entitlement Xcode injects in
          # Debug-like builds, which Apple notarization rejects.
          EMPTY_ENT="$RUNNER_TEMP/empty.entitlements"
          cat > "$EMPTY_ENT" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict/></plist>
          EOF

          sign_one() {
            codesign --force --sign "$CODE_SIGN_IDENTITY" \
              --options runtime --timestamp \
              --entitlements "$EMPTY_ENT" \
              "$1"
          }

          # 1) Bundles deepest-first (frameworks, helper apps, XPC services, plugin bundles).
          while IFS= read -r item; do
            echo "Signing bundle: $item"
            sign_one "$item"
          done < <(find "$APP_PATH" \
            \( -name '*.framework' -o -name '*.bundle' -o -name '*.app' -o -name '*.xpc' \) \
            -type d \
            | awk '{ print length($0), $0 }' | sort -rn | cut -d' ' -f2-)

          # 2) All Mach-O executables not contained in a freshly-signed bundle.
          #    `file --mime` reports Mach-O. We resign every one we find — duplicates
          #    are harmless because codesign --force overwrites.
          while IFS= read -r item; do
            if file "$item" | grep -q "Mach-O"; then
              echo "Signing binary: $item"
              sign_one "$item"
            fi
          done < <(find "$APP_PATH" -type f \
            ! -path "*/Frameworks/*/Headers/*" \
            ! -name "*.dylib.dSYM" \
            -perm +111 \
            | awk '{ print length($0), $0 }' | sort -rn | cut -d' ' -f2-)

          # 3) Main app last.
          echo "Signing main app: $APP_PATH"
          sign_one "$APP_PATH"

          # Verify
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Notarize app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          APP_PATH="out/git0.app"
          ZIP_PATH="$RUNNER_TEMP/notarize.zip"

          ditto -c -k --keepParent "$APP_PATH" "$ZIP_PATH"

          # Submit and capture the JSON response so we have the submission id
          # regardless of pass/fail.
          set +e
          SUBMIT_OUTPUT=$(xcrun notarytool submit "$ZIP_PATH" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --output-format json \
            --wait)
          SUBMIT_STATUS=$?
          set -e

          echo "$SUBMIT_OUTPUT"
          SUBMISSION_ID=$(echo "$SUBMIT_OUTPUT" | sed -nE 's/.*"id":"([^"]+)".*/\1/p' | head -1)
          NOTARY_STATUS=$(echo "$SUBMIT_OUTPUT" | sed -nE 's/.*"status":"([^"]+)".*/\1/p' | head -1)

          if [ "$NOTARY_STATUS" != "Accepted" ]; then
            echo "::error::Notarization failed: status=$NOTARY_STATUS, id=$SUBMISSION_ID"
            if [ -n "$SUBMISSION_ID" ]; then
              echo "Fetching Apple's notarization log…"
              xcrun notarytool log "$SUBMISSION_ID" \
                --apple-id "$APPLE_ID" \
                --team-id "$APPLE_TEAM_ID" \
                --password "$APPLE_APP_SPECIFIC_PASSWORD" || true
            fi
            exit 1
          fi

          xcrun stapler staple "$APP_PATH"
          spctl --assess --type execute --verbose=2 "$APP_PATH"

      - name: Build DMG
        run: |
          APP_PATH="out/git0.app"
          DMG_NAME="git0-${{ steps.version.outputs.version }}-${{ matrix.abi }}.dmg"

          mkdir -p dist
          cp -R "$APP_PATH" dist/
          ln -s /Applications dist/Applications

          hdiutil create -fs HFS+ -srcfolder dist -volname git0 "$DMG_NAME"
          rm -rf dist

          echo "DMG_NAME=$DMG_NAME" >> "$GITHUB_ENV"

      - name: Clean up keychain
        if: always()
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: git0-${{ matrix.abi }}-dmg
          path: ${{ env.DMG_NAME }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read short version
        id: version
        run: |
          VERSION=$(grep -A1 "CFBundleShortVersionString" Resources/Info.plist | tail -1 | sed -E 's/.*<string>(.*)<\/string>.*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Compute tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            SHORT=$(git rev-parse --short HEAD)
            TAG="v${{ steps.version.outputs.version }}-build.${{ github.run_number }}.$SHORT"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Tag: $TAG"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: git0 ${{ steps.tag.outputs.tag }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: artifacts/**/*.dmg
